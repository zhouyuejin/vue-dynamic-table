name: Test & Publish

on:
  push:
    branches: [main]
    tags: ['v*', 'vue-dynamic-table-v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci --include=optional
      - run: npm run build
      - run: npm test
      - run: npm run lint

  publish:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    environment: publish_token
    permissions:
      contents: write
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.ref, 'refs/tags/vue-dynamic-table-v') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - run: npm ci --include=optional
      - run: npm run build
      - run: npm test
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Extract CHANGELOG entry for ${{ github.ref_name }}
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#vue-dynamic-table-v}"
          awk -v v="$VERSION" '
            BEGIN { p = 0 }
            /^## \[/ {
              if (index($0, "[" v "]")) p = 1
              else if (p) exit
            }
            p
          ' CHANGELOG.md > release_body.md
          if [ ! -s release_body.md ]; then
            echo "::warning::No CHANGELOG entry for $VERSION, release body will be empty"
          fi
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_body.md
