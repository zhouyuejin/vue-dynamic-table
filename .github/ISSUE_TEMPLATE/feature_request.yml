name: ✨ Feature Request
description: 提出一个新功能或改进建议
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        在提新功能前请先搜索现有 issue，避免重复。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      description: 当前缺什么、用起来哪里不方便
      placeholder: |
        例如：搜索区的下拉只支持静态 options，我想让它支持动态加载 + 远程搜索……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的解决方案
      description: 你希望 API 长什么样、组件怎么用
      placeholder: |
        ```ts
        // 期望的 columns 配置：
        { prop: 'city', label: '城市', remote: true, remoteMethod: fetchCities }
        ```
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 考虑过哪些其他实现方式、放弃的原因
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 截图、参考链接、相关 issue
    validations:
      required: false
